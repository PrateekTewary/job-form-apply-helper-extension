<!DOCTYPE html>
<html>
<head>
  <title>Job Autofill</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      padding: 12px;
    }

    input, textarea, select, button {
      width: 100%;
      margin-bottom: 8px;
      padding: 8px;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    button {
      cursor: pointer;
    }

    h3, h4 {
      margin-bottom: 8px;
    }

    #status {
      font-size: 12px;
      color: green;
    }
  </style>
</head>
<body>
  <h3>Profile Info</h3>

  <input id="firstName" placeholder="First Name" />
  <input id="lastName" placeholder="Last Name" />
  <input id="fullName" placeholder="Full Name" />
  <input id="email" placeholder="Email" />
  <input id="phone" placeholder="Phone" />
  <input id="country" placeholder="Country" />
  <input id="location" placeholder="Location / City" />

  <input id="linkedin" placeholder="LinkedIn URL" />
  <input id="github" placeholder="GitHub URL" />
  <input id="portfolio" placeholder="Portfolio / Website URL" />

  <textarea id="summary" placeholder="Short Summary / Cover Letter"></textarea>

  <h4>Job Questions</h4>

  <select id="workAuthorization">
    <option value="">Legally authorized to work?</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>

  <select id="needsSponsorship">
    <option value="">Need visa sponsorship?</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>

  <select id="workedAtCompanyBefore">
    <option value="">Worked at this company before?</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>

  <button id="saveBtn">Save</button>
  <button id="fillBtn">Autofill Current Page</button>

  <p id="status"></p>

  <script src="popup.js"></script>
</body>
</html>
